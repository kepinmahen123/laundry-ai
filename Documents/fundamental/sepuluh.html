<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function onBtnClick(e){
        // document.getElementById('namaDepan');
        var intro = 'nama saya ';
        var hasil = document.getElementById('namaDepan').value;
        intro += hasil;
        console.log(intro);
        document.getElementById("namaDepan").value = "";

        var usia = document.getElementById('usia').value;
        intro += '. ' + usia + ' Tahun'
        document.getElementById("usia").value = "";

        var gender = document.getElementsByName('gender');
        if (gender[0].checked === true){
            intro += ', ' + gender[0].value;
        }else{
            intro += ', ' + gender[1].value;
        }
        

        document.getElementById("output").innerHTML = intro;
    }

    function onBtnForm(){
        var output = "";
        console.log(document.getElementByName('hobby')[0].checked);
        var hobbies = document.getElementsByName('hobby');
        if(hobbies[0].checked){
            output += hobbies[0].value + '\n';
        }
        if(hobbies[1].checked){
            output += hobbies[1].value + '\n';
        }
        if(hobbies[2].checked){
            output += hobbies[2].value + '\n';
        }
        document.getElementById("outputHobbies").innerHTML = output;
    }
    function addToHtml(){
        document.getElementById('here').innerHTML = '<h1>Hello</h1>'
    }
</script>

<body>
    <form onsubmit="return false" id = "form">
        Name: <input type="text" id="namaDepan" />
    <br>
    <br>
        Age: <input type="number" id="usia" />
    <br>
    <br><form>
    <input type="radio" name="gender" checked value="Pria"/>Pria
    <input type="radio" name="gender" value="Wanita"/>Wanita
    <br>

    <input type="checkbox" name="hobby" id="1" value="Futsal"/>Futsal
    <input type="checkbox" name="hobby" id="2" value="Basket"/>Basket
    <input type="checkbox" name="hobby" id="3" value="Badminton"/>Badminton
    </form>
    <button onclick="onBtnClick()">
        Click Me!
    </button>
    <button onclick="onBtnClick()">
        Gender
    </button>
    <button onclick="onBtnClick()">
        Hobi
    </button>
    <p id="output">Result here</p>
    <p id="outputHobbies">Result here</p>
</form>
    
</body>
</html>
